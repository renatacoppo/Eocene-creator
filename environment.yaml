# Create the eocene environment:
# mamba env create -f environment.yaml
# or
# conda env create -f environment.yaml
#
# All Python dependencies come from conda-forge, except the python-cdo wrapper: pip installs it from PyPI
# (package `cdo`, via `-e .`), because conda-forge `python-cdo` depends on the `cdo` binary.
# The CDO binary is NOT part of this environment: it comes from the system (Homebrew on macOS,
# conda-forge `cdo` or the HPC module on Linux). A cdo shipped in the env would shadow it on PATH.
# The baseline records the exact CDO version it was made with (see AGENTS.md, Scientific integrity).

name: eocene
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - eccodes
  - numpy
  - xarray
  - xesmf
  - pandas
  - netcdf4
  - scipy
  - dask-core
  - matplotlib
  - cartopy
  - pyyaml
  - sparse
  - ipykernel
  - jinja2
  - shapely
  - pip
  - pip:
    - -e .
