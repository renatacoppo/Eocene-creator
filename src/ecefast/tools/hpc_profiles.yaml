# HPC profiles: the environment modules loaded before DOMAINcfg is compiled and run
# (tools.backend: atos, profile chosen with tools.atos.profile).
# Read by ecefast.tools.ecearth (hpc_modules) and, through it, by run_domain_cfg.sh.

atos:
  description: "ECMWF Atos HPC"
  modules:
    - prgenv/intel
    - intel/2021.4.0
    - intel-mkl/19.0.5
    - hpcx-openmpi/2.9.0
    - hdf5-parallel/1.12.2
    - netcdf4-parallel/4.9.1
    - ecmwf-toolbox/2023.04.1.0
