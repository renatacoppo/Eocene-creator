[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecefast"
dynamic = ["version"]
authors = [
  { name="Renata Coppo", email="renatacoppo@cnr.it" },
  { name="Paolo Davini", email="paolo.davini@cnr.it" }
]
description = "Tool to generate EC-Earth4 DeepMIP boundary conditions"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "xarray",
    "xesmf",
    "pandas",
    "netcdf4",
    "cdo",
    "sparse",
    "ipykernel",
    "matplotlib",
    "pyyaml",
    "scipy",
    "dask",
    "cartopy",
    "jinja2",
    "shapely"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "import-linter"
]
docs = [
    "sphinx",
    "sphinx-rtd-theme"
]

[project.scripts]
ecefast = "ecefast.cli.main:main"

[project.urls]
"Homepage" = "https://github.com/renatacoppo/Eocene-creator"
"Bug Tracker" = "https://github.com/renatacoppo/Eocene-creator/issues"
"Repository" = "https://github.com/renatacoppo/Eocene-creator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.csv", "*.yaml", "*.j2", "*.sh", "*.md", "namelists/*"]

[tool.setuptools.dynamic]
version = {attr = "ecefast.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "unit: fast tests on synthetic in-memory data (CI)",
    "integration: synthetic input tree and fake backend (CI)",
    "local_data: needs the real data subset, set ECEFAST_TEST_DATA (opt-in, your machine)",
    "hpc: needs real data and DOMAINcfg on ECMWF Atos (manual)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Lenient start (task 1.4): syntax errors and undefined names only. Rules are tightened in later tasks.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# prepare_vegetation() is unused and refers to an undefined name NC4; to be removed or fixed in a later task.
"src/ecefast/periods/eocene/oifs/vegetation.py" = ["F821"]

# Architecture rules of AGENTS.md, checked with `lint-imports` (CI)
[tool.importlinter]
root_package = "ecefast"

[[tool.importlinter.contracts]]
name = "Layers: core -> tools -> components -> periods -> cli"
type = "layers"
layers = [
    "ecefast.cli",
    "ecefast.periods",
    "ecefast.components",
    "ecefast.tools",
    "ecefast.core",
]

[[tool.importlinter.contracts]]
name = "Components do not import each other"
type = "independence"
modules = [
    "ecefast.components.oifs",
    "ecefast.components.nemo",
    "ecefast.components.oasis",
    "ecefast.components.rnfm",
]

[[tool.importlinter.contracts]]
name = "Periods do not import each other"
type = "independence"
modules = [
    "ecefast.periods.present",
    "ecefast.periods.eocene",
]
